name: lg-vector-verification

on:
  push:
    branches:
      - research/vector-verification-v0
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  verify-en-core-web-lg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact spaCy/model artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install "spacy==3.8.11" "numpy==1.26.4" "click==8.3.1"
          curl -L --fail --silent --show-error \
            -o en_core_web_lg-3.8.0-py3-none-any.whl \
            "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl"
          printf '%s  %s\n' \
            "293e9547a655b25499198ab15a525b05b9407a75f10255e405e8c3854329ab63" \
            "en_core_web_lg-3.8.0-py3-none-any.whl" | sha256sum -c -
          python -m pip install ./en_core_web_lg-3.8.0-py3-none-any.whl

      - name: Run full semantic verification
        shell: bash
        run: python verification/verify_en_core_web_lg.py

      - name: Upload verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lg-vector-verification-result
          path: lg-vector-verification.json
          if-no-files-found: ignore
