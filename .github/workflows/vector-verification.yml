name: vector-verification

on:
  push:
    branches:
      - research/vector-verification-v0
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  verify-en-core-web-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact spaCy/model artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          curl -L --fail --silent --show-error \
            -o en_core_web_md-3.8.0-py3-none-any.whl \
            "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"
          printf '%s  %s\n' \
            "5e6329fe3fecedb1d1a02c3ea2172ee0fede6cea6e4aefb6a02d832dba78a310" \
            "en_core_web_md-3.8.0-py3-none-any.whl" | sha256sum -c -
          python -m pip install "spacy==3.8.11" "click==8.3.1" ./en_core_web_md-3.8.0-py3-none-any.whl

      - name: Load and test vectors
        shell: bash
        run: python verification/verify_en_core_web_md.py

      - name: Upload verification result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: vector-verification-result
          path: vector-verification.json
          if-no-files-found: ignore
